name: Contract Round-Trip

# Guards the exporter<->engine package-format contract: the exporter's
# production MessagePack/ext-42 encoder must round-trip through the engine's
# production decoder, and the path/role-table formulas hardcoded on both sides
# must agree. See contract/SPEC.md, contract/roundtrip/README.md, and
# contract/parity/README.md.
on:
  push:
    branches: [main]
    paths:
      - 'contract/**'
      - 'engine/runtime-binary-codec.mjs'
      - 'engine/runtime-binary-codec.d.mts'
      - 'engine/package.json'
      - 'engine/package-lock.json'
      - 'engine/part-runtime-core.mjs'
      - 'engine/src/runtime/**'
      - 'engine/src/parts/**'
      - 'exporter/Services/RuntimeJsonWriter.cs'
      - 'exporter/Services/PjskSekaiRuntimeExtensionBuilder.cs'
      - 'exporter/Services/RuntimeRoleCatalogExporter.cs'
      - 'exporter/Services/CharacterHeightResolver.cs'
      - 'exporter/Models/CostumeRegistryModels.cs'
      - 'exporter/Models/MasterCostumeModels.cs'
      - '.github/workflows/contract-roundtrip.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contract/**'
      - 'engine/runtime-binary-codec.mjs'
      - 'engine/runtime-binary-codec.d.mts'
      - 'engine/package.json'
      - 'engine/package-lock.json'
      - 'engine/part-runtime-core.mjs'
      - 'engine/src/runtime/**'
      - 'engine/src/parts/**'
      - 'exporter/Services/RuntimeJsonWriter.cs'
      - 'exporter/Services/PjskSekaiRuntimeExtensionBuilder.cs'
      - 'exporter/Services/RuntimeRoleCatalogExporter.cs'
      - 'exporter/Services/CharacterHeightResolver.cs'
      - 'exporter/Models/CostumeRegistryModels.cs'
      - 'exporter/Models/MasterCostumeModels.cs'
      - '.github/workflows/contract-roundtrip.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roundtrip:
    name: Cross-language round-trip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install engine dependencies
        run: npm ci --ignore-scripts
        working-directory: engine

      - name: Run round-trip contract test
        run: ./contract/roundtrip/run.sh

      - name: Run parity contract checks
        run: ./contract/parity/run.sh
