name: Engine Docker

on:
  push:
    # No paths filter here: combining "tags:" with "paths:" would stop tag
    # pushes from ever triggering, so release tags must stay unfiltered.
    branches: [main]
    tags:
      - 'engine-v*'
  pull_request:
    branches: [main]
    paths:
      - 'engine/Dockerfile'
      - 'engine/.dockerignore'
      - '.github/workflows/engine-docker.yml'
      - 'engine/package.json'
      - 'engine/package-lock.json'
      - 'engine/src/**'
      - 'engine/public/**'
      - 'engine/capture.html'
      - 'engine/capture-server.mjs'
      - 'engine/region-routing.mjs'
      - 'engine/runtime-binary-codec.mjs'
      - 'engine/vite.config.ts'
      - 'engine/vite.capture.config.ts'
      - 'engine/vite.basis.plugin.ts'
      - 'engine/tsconfig.json'
      - 'engine/tsconfig.build.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Keep the image name published by the original Team-Haruki/Haruki-3D-Engine
  # repository; downstream deployments reference it.
  IMAGE_NAME: team-haruki/haruki-3d-engine

jobs:
  # The push trigger cannot carry a paths filter (see the comment on "on:
  # push"), so branch pushes are gated here instead: build only when the
  # pushed range actually touched the engine. Tag pushes always build.
  changes:
    name: Detect engine changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    outputs:
      engine: ${{ steps.diff.outputs.hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff pushed range
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            # Unknown base (new branch or force push): build to be safe.
            echo "hit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
            engine/ .github/workflows/engine-docker.yml | grep -q .; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      !cancelled() && (
        github.event_name != 'push'
        || startsWith(github.ref, 'refs/tags/')
        || needs.changes.outputs.engine == 'true'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect stable release tag
        id: release
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/engine-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=auto would move :latest for any matching type=match tag,
          # including prereleases; gate :latest on a stable x.y.z tag instead.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=match,pattern=engine-v(.*),group=1
            type=match,pattern=engine-v(\d+\.\d+)\.\d+$,group=1
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}
            type=sha,prefix=sha-

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: engine
          file: engine/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
